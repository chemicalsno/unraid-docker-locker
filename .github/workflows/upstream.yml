name: Watch Unraid

on:
  # Weekly, so a change in Unraid shows up before it ships in a release.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Check the Unraid files Docker Locker depends on
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node upstream/check.mjs
