name: Test

on:
  push:
  pull_request:
  # Weekly, so a change in Unraid's development branch shows up before it ships.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install xmllint and PHP
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils php-cli

      - name: Check that the .plg is well-formed XML
        run: xmllint --noout docker.locker.plg

      - name: Check PHP syntax
        run: |
          for f in DockerLocker.page include/Lock.php; do
            out="$RUNNER_TEMP/$(basename "$f").php"
            xmllint --noent --xpath "string(//FILE[contains(@Name,'/$f')]/INLINE)" docker.locker.plg > "$out"
            # An XPath that matches nothing yields an empty file, which php -l accepts.
            test -s "$out" || { echo "No INLINE content found for $f"; exit 1; }
            php -l "$out"
          done

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Run tests against Unraid 7.3
        working-directory: test
        run: npm test

  upstream:
    # Only on the schedule or by hand: a change upstream shouldn't fail unrelated pushes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Download docker.js from Unraid's development branch
        run: >-
          curl -fsSL -o "$RUNNER_TEMP/docker.js"
          https://raw.githubusercontent.com/unraid/webgui/master/emhttp/plugins/dynamix.docker.manager/javascript/docker.js

      - name: Run tests against Unraid's development branch
        working-directory: test
        env:
          DOCKER_JS: ${{ runner.temp }}/docker.js
        run: npm test
