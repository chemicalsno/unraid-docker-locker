name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install xmllint and PHP
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils php-cli

      - name: Check that the .plg and Community Applications files are well-formed XML
        run: xmllint --noout docker.locker.plg ca_profile.xml plugins/*.xml

      - name: Check PHP syntax
        run: |
          for f in DockerLocker.page include/Lock.php; do
            out="$RUNNER_TEMP/$(basename "$f").php"
            xmllint --noent --xpath "string(//FILE[contains(@Name,'/$f')]/INLINE)" docker.locker.plg > "$out"
            # An XPath that matches nothing yields an empty file, which php -l accepts.
            test -s "$out" || { echo "No INLINE content found for $f"; exit 1; }
            php -l "$out"
          done

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Run tests against Unraid 7.3
        working-directory: test
        run: npm test

      # Installed copies only see a change as an update if the version goes up.
      - name: Check the version was increased
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF" -- docker.locker.plg; then
            echo "docker.locker.plg is unchanged, so no version bump is needed."
          else
            git show "origin/$BASE_REF:docker.locker.plg" > "$RUNNER_TEMP/base.plg"
            node release/plg.mjs check-bump "$RUNNER_TEMP/base.plg" docker.locker.plg
          fi
